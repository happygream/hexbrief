name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: dist/*.exe
          - os: macos-latest
            platform: mac
            artifact: dist/*.zip
          - os: ubuntu-latest
            platform: linux
            artifact: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache Electron binaries — biggest time saver (~200MB saved per run)
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # Cache electron-builder binaries (NSIS, etc)
      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Linux build deps
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Set macOS environment
        if: matrix.os == 'macos-latest'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV

      - name: Build Next.js
        run: npm run build

      - name: Package Electron (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build:${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexbrief-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -la release-files/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Read changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: HexBrief v${{ steps.version.outputs.VERSION }}
          body: |
            ## HexBrief v${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.NOTES }}

            ---

            ### Download

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `HexBrief-Setup-${{ steps.version.outputs.VERSION }}-x64.exe` | Installer — recommended |
            | Windows | `HexBrief-Setup-${{ steps.version.outputs.VERSION }}-ia32.exe` | 32-bit installer |
            | macOS | `HexBrief-${{ steps.version.outputs.VERSION }}-x64-mac.zip` | Intel Mac |
            | macOS | `HexBrief-${{ steps.version.outputs.VERSION }}-arm64-mac.zip` | Apple Silicon |
            | Linux | `HexBrief-${{ steps.version.outputs.VERSION }}-x64.AppImage` | Universal |
            | Linux | `HexBrief-${{ steps.version.outputs.VERSION }}-amd64.deb` | Debian / Ubuntu |

            > **macOS:** Right-click → Open on first launch to bypass Gatekeeper.
            > **Linux:** `chmod +x HexBrief-*.AppImage` before running.

          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
